<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="description" content="Saboot — deepfake victim kit: forensic evidence capture with SHA-256 hashing, 2-hour takedown notices under IT Rules 2026, police complaint drafts. 100% offline — evidence never leaves your phone." />
    <title>Saboot — Deepfake Victim Kit</title>
    <style>
      :root {
        --bg: #0a0f1a;
        --surface: #101828;
        --surface-2: #16213a;
        --border: #22304d;
        --text: #e6edf7;
        --muted: #8ba0c2;
        --accent: #7aa2ff;
        --accent-ink: #0a1230;
        --danger: #ff7d7d;
        --danger-bg: #2a1118;
        --ok: #56d9a3;
        --ok-bg: #0e2620;
        --warn: #f5c04e;
        --radius: 14px;
        --radius-sm: 10px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px; line-height: 1.55; min-height: 100dvh;
      }
      .app { max-width: 560px; margin: 0 auto; padding: 16px 16px 110px; }

      header { display: flex; align-items: center; gap: 12px; padding: 14px 0 18px; }
      .logo {
        width: 42px; height: 42px; border-radius: 12px;
        background: var(--accent); color: var(--accent-ink);
        display: grid; place-items: center; font-weight: 800; font-size: 20px;
      }
      h1 { font-size: 1.3rem; letter-spacing: -0.01em; }
      .tagline { font-size: 0.8rem; color: var(--muted); }

      .tabs { display: flex; gap: 8px; margin-bottom: 18px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 10; }
      .tab {
        flex: 1; padding: 10px 6px; border: 1px solid var(--border);
        background: var(--surface); color: var(--muted);
        border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600;
        cursor: pointer; text-align: center;
      }
      .tab[aria-selected="true"] { background: var(--surface-2); color: var(--text); border-color: var(--accent); }

      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
      }
      .card h2 { font-size: 1.02rem; margin-bottom: 8px; }
      .card p { font-size: 0.92rem; }
      .muted { color: var(--muted); font-size: 0.85rem; }
      .small { font-size: 0.8rem; }

      .panic-hero {
        background: linear-gradient(180deg, #231018 0%, var(--surface) 100%);
        border: 1px solid #4a2430; border-radius: var(--radius);
        padding: 20px 18px; margin-bottom: 14px;
      }
      .panic-hero h2 { color: var(--danger); font-size: 1.15rem; margin-bottom: 6px; }
      .panic-hero p { font-size: 0.95rem; }

      .q { margin: 14px 0; padding: 14px; background: var(--surface-2); border-radius: var(--radius-sm); }
      .q p { font-weight: 600; margin-bottom: 10px; font-size: 0.95rem; }
      .q .opts { display: flex; gap: 8px; flex-wrap: wrap; }
      .opt {
        flex: 1; min-width: 90px; padding: 12px 10px; border-radius: var(--radius-sm);
        border: 1px solid var(--border); background: var(--surface);
        color: var(--text); font-size: 0.9rem; font-weight: 600; cursor: pointer;
      }
      .opt[aria-pressed="true"] { border-color: var(--accent); background: #1c2a4a; }

      .step { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
      .step:last-child { border-bottom: none; }
      .step .when {
        flex-shrink: 0; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em;
        padding: 3px 8px; border-radius: 999px; height: fit-content; margin-top: 2px;
      }
      .when.now { background: var(--danger); color: #2a0d12; }
      .when.today { background: var(--warn); color: #2a220d; }
      .when.week { background: var(--ok); color: #0b2118; }
      .step .text { font-size: 0.92rem; }

      .clock {
        background: var(--ok-bg); border: 1px solid var(--ok);
        border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px;
        font-size: 0.85rem;
      }

      label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
      input, select, textarea {
        width: 100%; padding: 11px; background: var(--surface-2);
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        color: var(--text); font-size: 0.95rem; font-family: inherit;
      }
      textarea { font-size: 0.9rem; min-height: 90px; resize: vertical; }
      input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

      .btn {
        display: block; width: 100%; padding: 14px; margin-top: 14px;
        background: var(--accent); color: var(--accent-ink);
        border: none; border-radius: var(--radius-sm);
        font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center;
      }
      .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
      .btn.small-btn { padding: 10px; font-size: 0.9rem; margin-top: 10px; }

      .item {
        display: flex; gap: 10px; align-items: flex-start;
        padding: 12px; background: var(--surface-2);
        border-radius: var(--radius-sm); margin-bottom: 10px;
      }
      .item .hash {
        font-family: ui-monospace, 'Cascadia Mono', monospace;
        font-size: 0.68rem; color: var(--ok); word-break: break-all; margin-top: 3px;
      }
      .item .meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

      .doc-pre {
        white-space: pre-wrap; font-family: ui-monospace, 'Cascadia Mono', monospace;
        font-size: 0.74rem; line-height: 1.5; background: #0b1120;
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        padding: 14px; max-height: 420px; overflow-y: auto;
      }

      .seal {
        background: var(--ok-bg); border: 1px solid var(--ok); border-radius: var(--radius-sm);
        padding: 12px; font-family: ui-monospace, monospace; font-size: 0.7rem;
        word-break: break-all; margin-top: 10px;
      }

      .helpline { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
      .helpline:last-child { border-bottom: none; }
      .helpline .n { font-weight: 700; font-size: 0.9rem; color: var(--accent); }
      .helpline .d { font-size: 0.78rem; color: var(--muted); text-align: right; }

      .dropzone {
        border: 2px dashed var(--border); border-radius: var(--radius-sm);
        padding: 28px; text-align: center; color: var(--muted); font-size: 0.9rem;
        cursor: pointer; margin-top: 8px;
      }
      .dropzone.drag { border-color: var(--accent); color: var(--accent); }

      .disclaimer {
        font-size: 0.72rem; color: var(--muted); text-align: center;
        padding: 18px 8px 6px; line-height: 1.5;
      }
      footer { text-align: center; font-size: 0.78rem; color: var(--muted); padding: 8px 0 16px; }
      a { color: var(--accent); }

      .kit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .kit-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
      .kit-card h3 { font-size: 0.95rem; margin-bottom: 6px; }
      .kit-card .price { color: var(--ok); font-weight: 800; font-size: 1.1rem; margin: 6px 0; }
      .kit-card ul { margin: 8px 0 0 18px; font-size: 0.8rem; color: var(--muted); }
      .kit-card li { margin-bottom: 4px; }

      .pro-note {
        background: #1c2a4a; border: 1px solid var(--accent); border-radius: var(--radius-sm);
        padding: 10px 14px; font-size: 0.8rem; margin-top: 12px;
      }
      @media (max-width: 400px) { .kit-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
