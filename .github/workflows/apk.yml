name: Android APK (free CI build)

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'capacitor.config.json', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap add android 2>/dev/null || true
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
      - uses: actions/upload-artifact@v4
        with:
          name: saboot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
